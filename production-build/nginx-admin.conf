# Nginx config for Admin Panel container (static files)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No cache for HTML files
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, private";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
