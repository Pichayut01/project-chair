<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>DB Persistence Test</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        .box {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        pre {
            background: #f0f0f0;
            padding: 10px;
        }
    </style>
</head>

<body>
    <h1>System Settings API Test</h1>

    <div class="box">
        <h3>1. Get Current Settings</h3>
        <button onclick="getSettings()">GET /api/admin/system-settings</button>
        <pre id="getResult">Waiting...</pre>
    </div>

    <div class="box">
        <h3>2. Update Session Timeout to 120</h3>
        <button onclick="updateSettings(120)">PUT sessionTimeout = 120</button>
        <pre id="putResult">Waiting...</pre>
    </div>

    <div class="box">
        <h3>3. Update Session Timeout to 60</h3>
        <button onclick="updateSettings(60)">PUT sessionTimeout = 60</button>
    </div>

    <script>
        // Use the same token as the main app
        const token = localStorage.getItem('admin_token');
        const API_URL = '/api/admin/system-settings';

        if (!token) {
            document.body.innerHTML += '<h2 style="color:red">NO ADMIN TOKEN FOUND! Login in the main app first.</h2>';
        }

        async function getSettings() {
            try {
                const res = await fetch(`${API_URL}?_t=${Date.now()}`, {
                    headers: { 'x-auth-token': token }
                });
                const data = await res.json();
                document.getElementById('getResult').textContent = JSON.stringify(data, null, 2);
            } catch (e) {
                document.getElementById('getResult').textContent = 'Error: ' + e.message;
            }
        }

        async function updateSettings(timeout) {
            try {
                const payload = {
                    security: {
                        sessionTimeout: timeout,
                        allowRegistration: true // Keep this true for test
                    }
                };

                const res = await fetch(API_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-auth-token': token
                    },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                document.getElementById('putResult').textContent = JSON.stringify(data, null, 2);

                // Auto-refresh GET
                getSettings();
            } catch (e) {
                document.getElementById('putResult').textContent = 'Error: ' + e.message;
            }
        }
    </script>
</body>

</html>
